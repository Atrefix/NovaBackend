<div
  class="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-cyan-500/30 selection:text-cyan-300"
>
  @if (recentNotification()) {
    <div
      class="fixed top-5 right-5 z-[100] max-w-md bg-slate-900/95 backdrop-blur border border-cyan-500/40 text-slate-100 p-4 rounded-xl shadow-2xl shadow-cyan-950/40 flex items-start gap-3 animate-fade-in-down border-l-4 border-l-cyan-500"
    >
      <div
        class="flex items-center justify-center w-8 h-8 rounded-lg bg-cyan-950/80 border border-cyan-500/20 text-cyan-400"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-5 h-5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0M3.124 7.5A8.969 8.969 0 015.292 3m13.416 0a8.969 8.969 0 012.168 4.5"
          />
        </svg>
      </div>
      <div class="flex-1">
        <h4 class="text-xs font-semibold uppercase tracking-wider text-cyan-400">
          Notificación de Nova
        </h4>
        <p class="text-xs text-slate-300 mt-1 font-medium leading-relaxed">
          {{ recentNotification() }}
        </p>
      </div>
    </div>
  }

  <main class="flex-grow flex flex-col relative" [@routeAnimations]="prepareRoute(outlet)">
    <router-outlet #outlet="outlet"></router-outlet>
  </main>
</div>
